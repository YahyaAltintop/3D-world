name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main

# Workflow yalnızca repoyu okur; GITHUB_TOKEN'a yazma yetkisi verilmez.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Uygulama hiçbir ortam değişkeni okumaz; build'e secret verilmez.
      - run: npm ci
      - run: npm run build
      - name: Deploy to Firebase Hosting
        # Servis hesabı anahtarını alan üçüncü taraf action, commit SHA'sına sabitlenir (v0).
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
